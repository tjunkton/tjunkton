<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SLOPCRAFT</title>
<style>
*{box-sizing:border-box;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;font-family:"Courier New",monospace;color:#fff}
canvas{display:block;width:100%;height:100%}
#cross{position:fixed;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:difference}
#cross:before,#cross:after{content:"";position:absolute;background:#fff}
#cross:before{left:9px;top:0;width:2px;height:20px}#cross:after{top:9px;left:0;height:2px;width:20px}
#dbg{position:fixed;left:8px;top:8px;font-size:13px;text-shadow:1px 1px #000;pointer-events:none}
#tip{position:fixed;left:50%;bottom:108px;transform:translateX(-50%);text-shadow:2px 2px #000;font-size:18px;opacity:0;transition:opacity .4s;pointer-events:none}
#hotbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:2px;padding:4px;background:rgba(0,0,0,.45);border:2px solid #222;pointer-events:none}
.slot{position:relative;width:48px;height:48px;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737;display:flex;align-items:center;justify-content:center}
.slot img{width:36px;height:36px;image-rendering:pixelated;pointer-events:none}
.slot b,#cur b{position:absolute;right:3px;bottom:0;font-size:15px;color:#fff;text-shadow:2px 2px #3f3f3f;pointer-events:none}
#hotbar .slot.sel{outline:4px solid #fff;outline-offset:-2px;z-index:1}
#start,#inv{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#inv{display:none}
.panel{background:#c6c6c6;border:4px solid;border-color:#fff #555 #555 #fff;padding:14px;color:#333;box-shadow:0 0 0 3px #000}
.panel h3{margin:10px 0 4px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(9,48px);gap:2px}
#start .box{text-align:center;line-height:1.7;text-shadow:2px 2px #000;cursor:pointer}
#start h1{font-size:44px;margin:0 0 8px;letter-spacing:4px}
#cur{position:fixed;width:40px;height:40px;pointer-events:none;display:none;z-index:9;transform:translate(-50%,-50%)}
#cur img{width:100%;height:100%;image-rendering:pixelated}
#hearts{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);width:452px;display:flex;pointer-events:none}
#hearts span{font-size:22px;line-height:22px;color:#3a1515;text-shadow:0 0 2px #000}
#hearts .f{color:#e22}#hearts .hf{background:linear-gradient(90deg,#e22 50%,#3a1515 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
#hurt{position:fixed;inset:0;background:rgba(255,0,0,.35);opacity:0;pointer-events:none}
#dead{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(120,0,0,.6);z-index:20;font-size:40px;text-shadow:2px 2px #000;gap:16px}
#dead button{font:inherit;font-size:20px;padding:8px 24px;cursor:pointer}
#top{display:flex;justify-content:center;margin:6px 0}
#crf,#fur{display:none;align-items:center;gap:14px}
#cg{display:grid;gap:2px}.ar{font-size:30px}
.bar{width:48px;height:10px;background:#555;margin:6px 0}.bar i{display:block;height:100%;width:0;background:#fff}
#fur .col{display:flex;flex-direction:column;align-items:center}
#start{display:none!important}
input{user-select:text}
#cross,#dbg,#tip,#hotbar,#hearts,#air{display:none!important}
body.ingame #cross,body.ingame #dbg,body.ingame #tip,body.ingame #air{display:block!important}
body.ingame #hotbar,body.ingame #hearts{display:flex!important}
#uw{position:fixed;inset:0;background:rgba(20,70,170,.4);display:none;pointer-events:none}
#air{position:fixed;left:50%;bottom:102px;width:452px;transform:translateX(-50%);text-align:right;pointer-events:none;font-size:18px;text-shadow:1px 1px #000;color:#9df}
#menu{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;gap:10px;z-index:30;background-size:auto,64px 64px;image-rendering:pixelated;font-size:18px;text-align:center;overflow:auto;padding:16px;text-shadow:2px 2px #333}
#menu:before,#menu:after{content:"";margin:auto}
#menu h1{font-size:68px;letter-spacing:6px;margin:0;color:#e4e4e4;text-shadow:5px 5px #333,0 0 22px #5a5}
#menu h2{margin:0 0 6px}#menu h3{margin:10px 0 0}
.splash{color:#ff5;margin:0 0 18px;transform:rotate(-3deg);font-size:20px}
.btn,.sb{font:inherit;color:#fff;background:#8b8b8b;border:3px solid;border-color:#fff #373737 #373737 #fff;text-shadow:2px 2px #3f3f3f;cursor:pointer}
.btn{width:320px;padding:10px}.sb{padding:4px 12px;min-width:84px}
.btn:hover,.sb:hover{background:#7b7bb5}
.row,.wr{display:flex;gap:14px;align-items:center;justify-content:space-between;width:400px}
.wr{background:rgba(0,0,0,.5);padding:8px 10px;text-align:left;border:2px solid #222}.wr span{flex:1}.wr small{display:block;font-size:12px;opacity:.7}
#menu input[type=text]{font:inherit;width:320px;padding:6px;background:#111;color:#fff;border:2px solid #888}
.row b{display:inline-block;width:48px;text-align:right}
.row input[type=range]{width:170px;vertical-align:middle}
#menu select{font:inherit;background:#111;color:#fff;border:2px solid #888;padding:4px}
#cmd{position:fixed;left:8px;right:8px;bottom:8px;display:none;z-index:25;font:inherit;font-size:16px;padding:6px;background:rgba(0,0,0,.75);color:#fff;border:2px solid #888}
#chatlog{position:fixed;left:8px;bottom:48px;max-width:60%;pointer-events:none;font-size:15px;text-shadow:1px 1px #000;z-index:24;text-align:left;display:none}
body.ingame #chatlog{display:block}
body.nosurv #hearts,body.nosurv #air{display:none!important}
#hearts span{position:relative;display:inline-block;width:22px;text-align:left}
#hearts span.f{color:#e22}
#hearts span i{position:absolute;left:0;top:0;width:50%;overflow:hidden;color:#e22;font-style:normal;text-shadow:none}
#food{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);width:452px;display:none;flex-direction:row-reverse;justify-content:flex-start;pointer-events:none}
body.ingame #food{display:flex}body.nosurv #food{display:none!important}
.fd{position:relative;display:inline-block;width:20px;height:20px;margin-left:2px}
.fd img{width:20px;height:20px;image-rendering:pixelated;position:absolute;left:0;top:0}
.fd i{position:absolute;left:0;top:0;width:10px;height:20px;overflow:hidden}
#rcp{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:40;background:rgba(0,0,0,.55);cursor:pointer}
.rrow{display:flex;align-items:center;gap:14px;margin:8px 0}.rg{display:grid;gap:2px}
#ptabs{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px}
.tab{font:inherit;font-size:12px;padding:3px 7px;background:#8b8b8b;border:2px solid;border-color:#fff #555 #555 #fff;color:#222;cursor:pointer}.tab.on{background:#7fa57f}
.dur{position:absolute;left:5px;right:5px;bottom:4px;height:3px;background:#000;pointer-events:none}.dur i{display:block;height:100%}

#inv{background:rgba(0,0,0,.5)}
#ip{background:linear-gradient(#5a6074,#484e60);border:3px solid #1a1d29;border-radius:10px;padding:12px 16px;color:#eef1f8;box-shadow:0 10px 36px #000a;min-width:540px;text-align:left}
#ip .lbl{font-size:11px;margin:8px 0 3px;opacity:.75;letter-spacing:1.5px;text-transform:uppercase}
#ip .slot,#rcp .slot{background:#2b2f3d;border:2px solid #1a1d29;box-shadow:inset 0 0 0 1px #6a7188;border-radius:3px}
#ip .slot:hover{background:#3b4154;box-shadow:inset 0 0 0 2px #9fb3ff}
#ttl{font-weight:bold;margin-bottom:4px;font-size:15px}
#ctabs{display:none;flex-wrap:wrap;gap:3px;margin-bottom:8px}
.ctab{font:inherit;font-size:12px;padding:4px 9px;background:#3a3f50;border:2px solid #1a1d29;border-radius:5px;color:#dfe5f5;cursor:pointer}.ctab.on{background:#6d86d6;color:#fff}
#topv{display:flex;align-items:center;justify-content:center;gap:18px;min-height:216px}
#arm{display:flex;flex-direction:column;gap:2px}
#arm .slot:empty:before{content:attr(data-ph);font-size:10px;opacity:.35}
#pvbox{width:150px;height:210px;background:radial-gradient(#3b4156,#242837);border:2px solid #1a1d29;border-radius:8px;overflow:hidden}
#crf,#fur{display:none;align-items:center;gap:14px}
#palw{width:470px;height:258px;margin:0 auto}
#pal{display:grid;grid-template-columns:repeat(9,48px);gap:2px;height:254px;overflow-y:auto;align-content:start;padding-right:6px}
#tt{position:fixed;z-index:60;pointer-events:none;background:rgba(16,8,32,.94);border:2px solid #4b2f85;border-radius:5px;padding:6px 10px;font-size:13px;display:none;max-width:260px;line-height:1.45;color:#eee;text-align:left}
#tt b{color:#fff;font-size:14px}
#rcp{cursor:default}
.rwrap{display:flex;gap:16px;align-items:flex-start}
.rpan{background:linear-gradient(#5a6074,#484e60);border:3px solid #1a1d29;border-radius:10px;padding:12px;width:340px;color:#eef1f8}
.rscroll{max-height:60vh;overflow-y:auto;padding-right:6px}.rh{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:14px}.rh img{width:28px;height:28px;image-rendering:pixelated}
.dim{opacity:.7;font-size:12px}
/* menus */
#menu.pause{background:rgba(8,10,16,.5)!important}
#menu .card{background:rgba(18,22,32,.92);border:1px solid #4a5570;border-radius:12px;padding:18px 26px;box-shadow:0 10px 40px #000a;text-align:left;max-width:94vw;text-shadow:none}
#menu .btn{border-radius:8px;border:1px solid #7482aa;background:linear-gradient(#5b6a92,#3f4b6e);text-shadow:1px 1px #0008;width:320px;font-size:17px}
#menu .btn:hover,#menu .sb:hover{background:linear-gradient(#7184b8,#4e5d8a)}
#menu .sb{border-radius:6px;border:1px solid #7482aa;background:linear-gradient(#5b6a92,#3f4b6e);text-shadow:none;min-width:84px}.sb.on{outline:2px solid #ffd36b}
#menu h2{margin:0 0 10px;font-size:24px;text-align:center}
#menu .sec{margin:14px 0 6px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#9fb3ff;border-bottom:1px solid #3a4560;padding-bottom:3px}
.opt{width:580px;max-height:88vh;overflow-y:auto}
.orow{display:grid;grid-template-columns:170px 1fr 70px;align-items:center;gap:14px;margin:7px 0;font-size:15px}
.orow b{text-align:right;font-variant-numeric:tabular-nums;color:#ffd36b}.orow input[type=range]{width:100%;accent-color:#7ea4ff}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px 26px}
.kgrid .row{display:flex;justify-content:space-between;align-items:center;width:auto;gap:10px;font-size:14px}
.foot{display:flex;justify-content:center;margin-top:16px}
.skrow{display:flex;gap:26px;align-items:flex-start}#spv{width:230px;height:330px;background:radial-gradient(#3b4156,#1c202c);border:2px solid #4a5570;border-radius:10px;overflow:hidden}
.skctl{width:300px}.presets{display:flex;flex-wrap:wrap;gap:6px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:14px}.cgrid label{display:flex;justify-content:space-between;align-items:center}
.cgrid input[type=color]{width:46px;height:28px;border:1px solid #7482aa;border-radius:4px;background:none;padding:0;cursor:pointer}
.clog{width:620px}.clist{max-height:66vh;overflow-y:auto;padding-right:8px}
.ver-card{background:rgba(255,255,255,.05);border-radius:8px;padding:10px 14px;margin-bottom:10px}
.vh{font-size:18px;font-weight:bold}.vh span{font-size:13px;font-weight:normal;opacity:.75;margin-left:8px}
.sc{font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-top:8px}.ver-card ul{margin:3px 0 0 18px;padding:0;font-size:14px;line-height:1.45}
.ver{opacity:.55;font-size:13px;margin-top:12px}

.rowg{display:flex;gap:2px}
#shade{position:fixed;inset:0;background:rgba(0,0,12,.5);pointer-events:none;display:none;z-index:7}
#scan{position:fixed;inset:0;pointer-events:none;z-index:8}body:not(.ingame) #scan{display:none}
#scanfr{position:fixed;inset:0;pointer-events:none;display:none;z-index:9;box-shadow:inset 0 0 0 70px #0d1014,inset 0 0 140px 80px rgba(0,0,0,.75);background:rgba(60,255,150,.07)}
#gogfr{position:fixed;inset:0;pointer-events:none;display:none;z-index:9;background:rgba(40,255,140,.09);box-shadow:inset 0 0 0 22px #1a1d22,inset 0 0 80px 40px rgba(0,0,0,.65)}
#gogfr:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:40px;margin-left:-20px;background:#1a1d22}
#hooked{position:fixed;inset:0;pointer-events:none;display:none;z-index:6;background:radial-gradient(circle,transparent 40%,rgba(210,225,255,.24) 100%)}
#clockw{position:fixed;top:44px;left:50%;transform:translateX(-50%);display:none;background:rgba(10,12,18,.75);border:1px solid #6b789a;border-radius:10px;padding:5px 12px;font-size:15px;z-index:6}
#tpc{position:fixed;top:30%;left:50%;transform:translateX(-50%);display:none;font-size:22px;text-shadow:2px 2px #000;z-index:12;text-align:center}
#sleepov{position:fixed;inset:0;background:#05060d;opacity:0;pointer-events:none;transition:opacity .8s;z-index:11;display:flex;align-items:center;justify-content:center;font-size:34px;color:#8fa3ff}
#cmdhint{position:fixed;left:8px;bottom:44px;font-size:13px;color:#bcd;z-index:26;display:none;background:rgba(0,0,0,.65);padding:2px 8px;border-radius:4px}
#phone{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:45;font-family:system-ui,sans-serif}
#phf{width:340px;height:640px;border:10px solid #15171c;border-radius:38px;background:#0c0f16;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 50px #000c;color:#eef;text-align:left}
#phs{flex:1;overflow-y:auto;overflow-x:hidden}#phbar{display:flex;justify-content:space-around;padding:6px;background:#12151c}#phbar button{background:none;border:none;color:#cfd6ff;font-size:22px;cursor:pointer}
.ph-status{display:flex;justify-content:space-between;padding:7px 16px;font-size:12px;background:#12151c;color:#9aa6d6}
.ph-clock{text-align:center;font-size:46px;font-weight:300;padding:18px 0 4px}.ph-clock small{display:block;font-size:14px;opacity:.6}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:18px}
.app{background:#1b2030;border:none;border-radius:16px;color:#dfe5ff;padding:14px 4px;font-size:12px;cursor:pointer}.app span{display:block;font-size:30px;margin-bottom:4px}.app:hover{background:#262d44}
.gtitle{text-align:center;padding:8px;font-size:18px}.pbtn{display:block;margin:8px auto;width:80%;padding:10px;background:#2b3556;border:none;border-radius:10px;color:#fff;font-size:15px;cursor:pointer}.pbtn:hover{background:#38457a}

.ttt{display:grid;grid-template-columns:repeat(3,86px);gap:6px;justify-content:center;margin:12px 0}.ttt button{height:86px;font-size:44px;background:#1b2030;border:none;border-radius:10px;color:#fff;cursor:pointer}

.bcm{height:430px;overflow-y:auto;padding:8px 10px;font-size:13px}.bcm div{margin-bottom:8px;line-height:1.35}.bcm b{margin-right:6px}.bci{display:flex;gap:6px;padding:8px;background:#141826}.bci input{flex:1;background:#232a42;border:none;color:#fff;border-radius:8px;padding:8px}.bci button{background:#5865f2;border:none;color:#fff;border-radius:8px;padding:0 12px;cursor:pointer}
.bt{display:flex;gap:6px;padding:8px;background:#141826}.bt button{flex:1;padding:6px;background:#232a42;border:none;color:#cfd6ff;border-radius:10px;cursor:pointer}.bt button.on{background:#e60023;color:#fff}
.bcols{display:flex;gap:8px;padding:8px;align-items:flex-start}.bcol{flex:1;display:flex;flex-direction:column;gap:8px}.bcard{background:#1b2030;border-radius:12px;overflow:hidden}.bcard canvas{width:100%;display:block;border-radius:0!important}.bcard div{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;font-size:11px}.bcard button{background:none;border:none;font-size:15px;cursor:pointer;color:#aab}.bcard button.on{color:#ff4d6d}
.kv{display:flex;justify-content:space-between;gap:16px;padding:5px 2px;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}.kv span{opacity:.7}.kv b{text-align:right;font-weight:600}
.rtabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}.rpan{width:420px!important}
#tt{font-size:12px!important;padding:5px 9px!important;line-height:1.4!important}#tt b{font-size:13px!important}
.cgrid select{background:#111;color:#fff;border:1px solid #7482aa;border-radius:4px;padding:3px}

html,body{overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#tc{position:fixed;inset:0;display:none;z-index:10;pointer-events:none;touch-action:none}#tc *{touch-action:none}
#tlook{position:absolute;left:35%;right:0;top:0;bottom:0;pointer-events:auto}
#tjoy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);pointer-events:auto}
#tjk{position:absolute;left:47px;top:47px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.42);pointer-events:none}
.tb{position:absolute;pointer-events:auto;width:70px;height:70px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(20,24,36,.55);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;padding:0;user-select:none}
.tb.big{width:86px;height:86px;font-size:34px}.tb.sm{width:52px;height:52px;font-size:20px}
.tb.on,.tb.down{background:rgba(110,140,230,.8)}
body.touch #hotbar{pointer-events:auto;z-index:12}

#ip,#phf,.rpan,#menu .card{zoom:var(--ui,1)}

#ip{max-height:none}

<div id="start"><div class="box"><h1>SLOPCRAFT</h1>Click to play<br>
WASD move · Ctrl sprint · Shift crouch · Space jump<br>

 if(c==='help'||c==='?')say('Commands: /give <item> [n], /gamemode <survival|creative|spectator>, /tp <x> <y> <z>, /time <day|noon|sunset|night|midnight|0-1>, /summon <mob>, /killall, /gamerule, /heal, /kill, /clear, /seed, /locate <biome>');
 else if(c==='give'){const id=findItem(a[1]||'');if(!id){say('Unknown item: '+(a[1]||'')+' (try /give stone, or an item name)');return}
  const n=Math.max(1,Math.min(2304,parseInt(a[2])||1));let left=n;while(left>0){const k=Math.min(left,mx(id));stash({id,n:k});left-=k}refresh();say('Gave '+n+' × '+name(id))}
 else if(c==='gamemode'||c==='gm'){const m=GMS[(a[1]||'').toLowerCase()];if(!m)say('Usage: /gamemode <survival|creative|spectator>');else setGM(m)}
 else if(c==='tp'){const x=num(a[1],p.x),y=num(a[2],p.y),z=num(a[3],p.z);if([x,y,z].some(isNaN))say('Usage: /tp <x> <y> <z>');else{p.x=x;p.y=y;p.z=z;v.x=v.y=v.z=0;peak=y;say('Teleported to '+[x,y,z].map(n=>n.toFixed(1)).join(' '))}}
 else if(c==='time'){const w=(a[1]||'').toLowerCase(),T={day:.05,noon:.25,sunset:.47,night:.6,midnight:.75};
  if((w in T||(w!==''&&!isNaN(+w)))){tod=(((w in T?T[w]:+w)%1)+1)%1;say('Time set')}else say('Usage: /time <day|noon|sunset|night|midnight|0-1>')}
 else if(c==='gamerule'){const k=Object.keys(GR).find(x=>x.toLowerCase()===(a[1]||'').toLowerCase());
  if(!a[1])say('Rules: '+Object.keys(GR).map(x=>x+'='+GR[x]).join(', '));
  else if(!k)say('Unknown gamerule. Rules: '+Object.keys(GR).join(', '));
  else if(a[2]===undefined)say(k+' = '+GR[k]);
  else if(/^(true|false)$/i.test(a[2])){GR[k]=a[2].toLowerCase()==='true';W_.rules={...GR};say('Gamerule '+k+' set to '+GR[k])}
  else say('Value must be true or false')}
 else if(c==='heal'){hp=20;food=20;sat=5;air=15;drawHP();drawFood();say('Healed')}
 else if(c==='summon'){const t=(a[1]||'').toLowerCase();if(!MT[t])say('Mobs: '+Object.keys(MT).join(', '));else{spawnMob(t,p.x-Math.sin(yaw)*4,p.y+1,p.z-Math.cos(yaw)*4);say('Summoned '+t)}}
 else if(c==='killall'){mobs.splice(0).forEach(m=>scene.remove(m.g));say('Removed all mobs')}
 else if(c==='kill')hurt(1e9,true);
 else if(c==='clear'){inv.fill(null,0,36);refresh();say('Inventory cleared')}
 else if(c==='locate')locateBiome(a.slice(1).join(' ').toLowerCase());
  else if(c==='seed')say('Seed: '+SEED);
 else say('Unknown command. Type /help')}

function resize(){renderer.setSize(innerWidth,innerHeight,false);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.documentElement.style.setProperty('--ui',Math.min(1,innerWidth/640,innerHeight/620).toFixed(2));document.documentElement.style.setProperty('--hud',Math.min(1,innerWidth/520).toFixed(2));camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();handCam.aspect=camera.aspect;handCam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let last=performance.now(),fps=0,fr=0,wtAcc=0,saveT=0,bio='';
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;fps+=(1/Math.max(dt,1e-4)-fps)*.05;
 if(state==='play'||state==='loading'){updateChunks(state==='loading'?30:6,p.x,p.z);flushUrgent();if(++fr%90===0)unloadFar()}
 if(state==='loading')checkLoaded();
 else if(state==='play'&&!menuOpen){
  if(GR.doDaylightCycle)tod=(tod+dt/DAYLEN*(sleeping?60:1))%1;survival(dt);
  if((locked||invOpen||chatOpen||phoneOpen)&&!dead&&!sleeping){for(let i=0;i<3;i++)update(dt/3);cd-=dt;if(locked&&cd<=0&&mouse[2]){act(2);cd=.2}}
  wtAcc+=dt;if(wtAcc>.2){wtAcc=0;waterTick()}
  updateFalling(dt);saveT+=dt;if(saveT>15){saveT=0;saveWorld()}}
 eye+=((sleeping?.3:sneak?1.27:1.62)-eye)*Math.min(1,dt*14);
 camera.position.set(p.x,p.y+eye,p.z);camera.rotation.set(pitch,yaw,0);
 const ft=fov*(1-.12*Math.min(1,bowT));if(Math.abs(camera.fov-ft)>.01){camera.fov=ft;camera.updateProjectionMatrix()}
 if(state==='play'){headW=isW(get(Math.floor(p.x),Math.floor(p.y+eye),Math.floor(p.z)));
  const t=locked&&gm!=='spectator'?ray():null;box.visible=!!t;if(t)fitBox(box,t);
  document.getElementById('uw').style.display=headW?'block':'none';document.getElementById('air').textContent=air<14.5?'○'.repeat(Math.ceil(air/1.5)):'';
  if(fr%30===0)bio=BNAME[colInfo(Math.floor(p.x),Math.floor(p.z)).b];
  document.getElementById('dbg').textContent=`${fps|0} fps  XYZ ${p.x.toFixed(1)} ${p.y.toFixed(1)} ${p.z.toFixed(1)}  ${bio}  ${tod<.5?'Day':'Night'}`}
 else box.visible=false;
 {const hq=inv[sel],hr=state==='play'&&hq?EM[hq.id]||0:0;UN.uHL.value.set(p.x,p.y+eye,p.z,hr?hr+Math.sin(now/130)*.4:0)}
 touchUI();sky();updateHand(dt);renderer.autoClear=false;renderer.clear();renderer.render(scene,camera);renderer.clearDepth();renderer.render(handScene,handCam);if(pvEl)pvFrame(dt);drawScan()}
setRD(OPT.rd);applyTouch();show('title');requestAnimationFrame(frame);
